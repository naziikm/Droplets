<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idea Drip</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header h1 .droplet-icon {
      font-size: 28px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .content-section {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .content-section:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .section-label .icon {
      font-size: 14px;
    }

    .section-text {
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
    }

    .idea-section {
      background: linear-gradient(135deg, rgba(255, 193, 7, 0.3) 0%, rgba(255, 152, 0, 0.2) 100%);
    }

    .question-section {
      background: linear-gradient(135deg, rgba(33, 150, 243, 0.3) 0%, rgba(3, 169, 244, 0.2) 100%);
    }

    .thought-section {
      background: linear-gradient(135deg, rgba(156, 39, 176, 0.3) 0%, rgba(233, 30, 99, 0.2) 100%);
    }

    .footer {
      text-align: center;
      margin-top: 16px;
    }

    .refresh-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 10px 24px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .refresh-btn:active {
      transform: scale(0.98);
    }

    .test-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.7);
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 10px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }

    .test-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .loading {
      text-align: center;
      padding: 40px;
      opacity: 0.7;
    }

    .error {
      text-align: center;
      padding: 20px;
      color: #ff6b6b;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .content-section {
      animation: fadeIn 0.4s ease forwards;
    }

    .content-section:nth-child(1) { animation-delay: 0.1s; }
    .content-section:nth-child(2) { animation-delay: 0.2s; }
    .content-section:nth-child(3) { animation-delay: 0.3s; }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="droplet-icon">💧</span> Idea Drip</h1>
    <p>A drop of inspiration for you</p>
  </div>

  <div id="content">
    <div class="loading">Loading inspiration...</div>
  </div>

  <div class="footer">
    <button class="refresh-btn" id="refreshBtn">
      <span>🔄</span> New Inspiration
    </button>
    <br>
    <button class="test-btn" id="testBtn">
      Test Droplet Animation
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
